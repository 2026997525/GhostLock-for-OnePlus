- name: Setup NDK
  uses: nttld/setup-ndk@v1
  id: setup-ndk
  with:
    ndk-version: r25c

- name: Set NDK environment
  run: |
    echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
    echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
    echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

- name: Create compiler symlink and set target
  run: |
    NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
    ln -s "$NDK_BIN/clang" "$NDK_BIN/aarch64-linux-android35-clang"
    echo "CFLAGS=--target=aarch64-linux-android35" >> $GITHUB_ENV
    echo "LDFLAGS=--target=aarch64-linux-android35" >> $GITHUB_ENV

- name: Build (verbose)
  run: |
    make V=1 2>&1 | tee build.log

- name: List build output
  run: |
    ls -la ghostlock || echo "ghostlock not found in current directory"
    find . -name "ghostlock" -type f