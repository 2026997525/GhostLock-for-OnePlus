name: Build ghostlock

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # 如果有子模块，一并拉取

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c   # 可改为 r26d

      - name: Print NDK path (debug)
        run: |
          echo "NDK path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          # 同时也设置 NDK 变量，以防 Makefile 用这个
          echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install build tools (if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Verify NDK compiler
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang --version

      - name: Build with verbose output
        run: |
          make V=1 2>&1 | tee build.log
        # 如果 make 仍失败，保留 build.log 作为 artifact

      - name: Upload build log (if failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload final executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-elf
          path: ghostlock
