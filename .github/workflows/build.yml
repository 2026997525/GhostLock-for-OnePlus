name: Build Android APK

# 触发条件：手动触发、push到main、或PR
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 设置 Java (NDK 构建通常需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Android SDK 和 NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c  # 项目要求 r25+[reference:1]，可按需改为 r26d[reference:2]

      # 4. 设置环境变量 (关键步骤)
      - name: Set NDK Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # 5. 执行构建 (默认 API 35)
      - name: Build ghostlock
        run: make

      # 6. 上传构建产物 (artifacts)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-elf
          path: ghostlock  # 根据项目文档，产物是静态链接的 ARM64 ELF 可执行文件[reference:3]
